name: Test

# Unit/integration tests only (vitest) -- fast, no browser, cheap to run on
# every push. Playwright's e2e suite (npm run test:e2e) is intentionally NOT
# run here: installing a real browser plus driving it through a live
# wrangler pages dev instance is the expensive part of this repo's testing,
# both in CI minutes and wall-clock time, and running it on every push risks
# burning through the GitHub Actions free-tier allotment. The suite is still
# fully maintained in e2e/ -- run it locally (`npm run test:e2e`) before
# merging anything that touches session-logging, program upload/update, or
# sync, since that's exactly what it covers that vitest can't (the real
# browser/HTTP/service-worker layer). See e2e/README.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit + integration tests (vitest)
        run: npm test -- --run

      # --- Playwright e2e -- commented out, not removed, to re-enable later
      # (e.g. nightly schedule, workflow_dispatch, or once budget allows
      # running it on every push) without re-deriving these steps:
