name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Local-dev auth stand-in only (see functions/api/_middleware.js) --
      # never a real secret, Access verification is never reached in CI.
      - name: Write .dev.vars for local dev auth
        run: |
          cat > .dev.vars <<'EOF'
          ENVIRONMENT=development
          DEV_USER_EMAIL=ci@example.test
          EOF

      - name: Unit + integration tests (vitest)
        run: npm test -- --run

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
