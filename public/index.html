<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ski Strength Log</title>
<meta name="theme-color" content="#1D5FD1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#EEF2F4; --surface:#FFFFFF; --sunk:#F5F8F9; --ink:#15212B; --muted:#5B6B78;
  --line:#D5DDE3; --accent:#1D5FD1; --accent-ink:#FFFFFF; --accent-soft:#E3ECFB;
  --ok:#23804F; --ok-soft:#E1F2E8; --warn:#B4541A; --warn-soft:#FBE6D8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D141A; --surface:#15202A; --sunk:#111A22; --ink:#E6EDF2; --muted:#93A3B0;
    --line:#26343F; --accent:#6EA2FF; --accent-ink:#0D141A; --accent-soft:#1B2C45;
    --ok:#5CC98D; --ok-soft:#173226; --warn:#F09A5E; --warn-soft:#3A2416; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0D141A; --surface:#15202A; --sunk:#111A22; --ink:#E6EDF2; --muted:#93A3B0;
  --line:#26343F; --accent:#6EA2FF; --accent-ink:#0D141A; --accent-soft:#1B2C45;
  --ok:#5CC98D; --ok-soft:#173226; --warn:#F09A5E; --warn-soft:#3A2416; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%;
  padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}

/* Top bar */
.top{position:sticky;top:0;z-index:10;background:var(--ground);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font:700 22px/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font:500 11px/1.2 var(--body);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.sync-status{font-size:11px;color:var(--muted);margin-right:8px;white-space:nowrap}

/* Theme picker: a custom listbox, not a native <select> — native dropdown
   chrome is OS-rendered and ignores our styling (worst on Safari/macOS). */
.theme-picker{position:relative}
.theme-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 26px 6px 10px;font:inherit;font-size:13px;color:var(--ink);position:relative}
.theme-btn::after{content:"";position:absolute;right:10px;top:50%;width:7px;height:7px;margin-top:-5px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg)}
.theme-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:120px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:4px;margin:0;list-style:none;z-index:30}
.theme-menu li{padding:8px 10px;border-radius:6px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}
.theme-menu li:hover,.theme-menu li:focus-visible{background:var(--sunk);outline:none}
.theme-menu li[aria-selected="true"]::after{content:"✓";color:var(--accent);font-weight:700}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:12px 4px 14px;font:700 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nav button[aria-current="true"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}

/* Pickers */
.weeks-row{display:flex;align-items:center;gap:6px;margin-top:12px}
.weeks-nav{flex:none;width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font:600 15px/1 var(--body);color:var(--muted)}
.weeks-nav:disabled{opacity:.3}
.weeks{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin:0;flex:1;min-width:0;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 14px/1 var(--mono);white-space:nowrap}
.chip.status-upcoming{color:var(--muted)}
.chip.status-current{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.status-hit{border-color:var(--ok);color:var(--ink);background:var(--ok-soft)}
.chip.status-miss{border-color:var(--warn);color:var(--ink);background:var(--warn-soft)}
.chip[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent);font-weight:700}
.sessions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.seg{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.seg .tick{color:var(--ok);font-size:12px}
.seg[aria-pressed="true"] .tick{color:var(--ground)}

.head{margin:18px 0 8px}
.head .progress{margin-top:6px}
.eyebrow{font:500 12px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 32px/1.05 var(--display);margin:4px 0 0;text-wrap:balance;letter-spacing:.01em}
h2{font:700 19px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0}

/* Blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:12px}
details.panel>summary{list-style:none;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::after{content:"＋";color:var(--muted)}
details.panel[open]>summary::after{content:"－"}
.panel-body{padding:0 14px 14px}
.erg{width:100%;border-collapse:collapse;font-size:14px}
.erg td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
.erg td:first-child{font-family:var(--mono);white-space:nowrap;padding-right:10px;color:var(--muted);font-size:13px}
.erg td:last-child{text-align:right;color:var(--muted);white-space:nowrap;padding-left:8px}
.kv{margin:10px 0 0;font-size:14px}
.kv b{display:block;font:600 12px/1.3 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.note-muted{color:var(--muted);font-size:13px;margin:10px 0 0}

/* Exercise card */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:12px}
.ex.done{border-color:var(--ok);background:linear-gradient(var(--ok-soft),var(--ok-soft)) padding-box}
.ex>summary{list-style:none;cursor:pointer;padding:14px}
.ex>summary::-webkit-details-marker{display:none}
.ex-body{padding:0 14px 14px}
.ex-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-name{font-weight:600;font-size:16px;line-height:1.3}
.ex-name a{text-decoration:none;color:inherit;border-bottom:1px dashed var(--muted)}
.ex-info{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:4px;padding:0;
  border:1px solid var(--line);border-radius:999px;background:var(--sunk);color:var(--muted);font-size:12px;font-style:normal;vertical-align:middle}
.ex-info[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.ex-actions{display:flex;align-items:center;gap:8px;flex:none}
.ex-done-badge{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
.disclosure{width:14px;text-align:center;color:var(--muted);font-size:15px}
.disclosure::before{content:"＋"}
.ex[open] .disclosure::before{content:"－"}
.vid{flex:none;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:4px 8px;text-decoration:none;color:var(--accent);background:var(--sunk)}
.ex-next{width:100%;margin-top:12px;height:40px;border:1px solid var(--ok);background:var(--ok-soft);color:var(--ink);border-radius:8px;font-weight:700;font-size:14px}
.rx{font:500 15px/1.3 var(--mono);margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;border-radius:6px;padding:3px 8px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.tag.target{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.cue{font-size:13px;color:var(--muted);margin-top:8px}
.ex-desc{font-size:13px;color:var(--ink);background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin:8px 0 0}
.ex-group .ex-top .ex-name{white-space:normal}
.ex-sub{padding-top:14px}
.ex-sub:first-of-type{padding-top:0}
.ex-sub-label{font:700 12px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.ex-sub-divider{border:0;border-top:1px solid var(--line);margin:14px 0 0}
.sets{margin-top:10px;display:grid;gap:6px}
.set{display:grid;grid-template-columns:36px 1fr 1fr 64px;gap:6px;align-items:center}
.set.nl{grid-template-columns:36px 1fr 64px}
.set.nr{grid-template-columns:36px 1fr 1fr}
.set.nl.nr{grid-template-columns:36px 1fr}
.set .n{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font:600 14px var(--mono);color:var(--muted)}
.set .n[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.field{position:relative}
.field input{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 34px 0 10px;font:500 15px var(--mono);font-variant-numeric:tabular-nums}
.field span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.sets-head{display:grid;gap:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row-actions{display:flex;gap:8px;margin-top:8px}
.link-btn{border:0;background:none;padding:4px 0;color:var(--accent);font-size:13px;font-weight:600}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;resize:vertical;margin-top:8px}

/* Footer form */
.finish{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.lab{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.soreness{display:flex;gap:4px}
.soreness button{flex:1;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font:600 14px var(--mono)}
.soreness button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.primary{width:100%;margin-top:12px;height:48px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 18px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.secondary{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.progress{font:500 13px var(--mono);color:var(--muted)}

/* Log + tests */
.entry{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:10px}
.entry summary{padding:12px 14px;list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.entry summary::-webkit-details-marker{display:none}
.entry .d{font:500 13px var(--mono);color:var(--muted);white-space:nowrap}
.entry .b{padding:0 14px 12px;font-size:14px}
.entry .b p{margin:6px 0}
.entry .b .x{font-weight:600}
.entry .b .v{font-family:var(--mono);font-size:13px}
.danger{color:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:32px 0}

/* Progress */
.pr-badge{font-size:11px;font-weight:700;color:var(--ink);background:var(--ok-soft);border:1px solid var(--ok);border-radius:6px;padding:2px 6px;margin-left:6px;white-space:nowrap}
.spark{display:block;width:100%;height:auto;margin-top:8px}
.spark-line{fill:none;stroke:var(--accent);stroke-width:2}
.spark-dot{fill:var(--accent)}
.spark-label{font:500 11px var(--mono);fill:var(--muted)}
.toast.pr{background:var(--ok);color:var(--surface)}
.tbl-wrap{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.tests{border-collapse:collapse;width:100%;font-size:14px}
table.tests th,table.tests td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.tests td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
table.tests th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.tests th[scope="row"]{font-size:14px;letter-spacing:normal;text-transform:none;color:var(--ink);font-weight:400}
.maxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat span{font:700 30px/1.1 var(--display)}
.stat em{font-style:normal;font-size:12px;color:var(--muted);display:block}
.test-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.test-form .full{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);
  padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.io textarea{font:13px/1.4 var(--mono);min-height:120px}
@media (prefers-reduced-motion:no-preference){.ex{transition:border-color .2s,background .2s}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">Ski Strength<small id="phaseLine">2026–27 season</small></div>
  <span class="sync-status" id="syncStatus" aria-live="polite"></span>
  <div class="theme-picker">
    <button type="button" class="theme-btn" id="themeBtn" aria-haspopup="listbox" aria-expanded="false">Auto</button>
    <ul class="theme-menu" id="themeMenu" role="listbox" aria-label="Theme" hidden>
      <li role="option" tabindex="-1" data-value="" aria-selected="true">Auto</li>
      <li role="option" tabindex="-1" data-value="light" aria-selected="false">Light</li>
      <li role="option" tabindex="-1" data-value="dark" aria-selected="false">Dark</li>
    </ul>
  </div>
</div></header>

<main class="wrap" id="app"></main>

<nav class="nav" aria-label="Sections"><div class="wrap">
  <button type="button" data-view="session" aria-current="true">Session</button>
  <button type="button" data-view="log">Log</button>
  <button type="button" data-view="tests">Tests</button>
  <button type="button" data-view="progress">Progress</button>
</div></nav>

<div class="toast" id="toast" role="status" hidden></div>

<script src="program.js"></script>
<script src="sync.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
